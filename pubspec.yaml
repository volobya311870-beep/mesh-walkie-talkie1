name: mesh_walkie_talkie
description: "Mesh мессенджер-рация без интернета и сотовой сети."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  nearby_connections: ^5.1.0 
  record: ^5.1.2 
  audioplayers: ^6.0.0 
  flutter_opus: ^0.1.3
  dash_chat_2: ^0.0.21
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
